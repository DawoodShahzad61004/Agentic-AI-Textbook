<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><rect width="1200" height="680" fill="#fff"/><g font-family="Times New Roman" text-anchor="middle"><text x="600" y="45" font-size="31" font-weight="bold">Multiple tool calls must remain paired</text><rect x="410" y="85" width="380" height="75" rx="22" fill="#2C3E6B" stroke="#000" stroke-width="4"/><text x="600" y="121" fill="#fff" font-size="23" font-weight="bold">Assistant message</text><text x="600" y="148" fill="#fff" font-size="17">three requested calls</text><rect x="80" y="245" width="280" height="95" fill="#F2F2F2" stroke="#000" stroke-width="3"/><text x="220" y="280" font-size="21" font-weight="bold">call_A</text><text x="220" y="310" font-size="18">retrieve “clinical ASD”</text><rect x="460" y="245" width="280" height="95" fill="#D9D9D9" stroke="#000" stroke-width="3"/><text x="600" y="280" font-size="21" font-weight="bold">call_B</text><text x="600" y="310" font-size="18">retrieve “drive safety”</text><rect x="840" y="245" width="280" height="95" fill="#808080" stroke="#000" stroke-width="3"/><text x="980" y="280" fill="#fff" font-size="21" font-weight="bold">call_C</text><text x="980" y="310" fill="#fff" font-size="18">compress context</text><line x1="520" y1="160" x2="250" y2="237" stroke="#000" stroke-width="3" marker-end="url(#a)"/><line x1="600" y1="160" x2="600" y2="237" stroke="#000" stroke-width="3" marker-end="url(#a)"/><line x1="680" y1="160" x2="950" y2="237" stroke="#000" stroke-width="3" marker-end="url(#a)"/><rect x="80" y="445" width="280" height="95" fill="#F2F2F2" stroke="#000" stroke-width="3"/><text x="220" y="482" font-size="21" font-weight="bold">result_A</text><text x="220" y="512" font-size="18">id = call_A</text><rect x="460" y="445" width="280" height="95" fill="#D9D9D9" stroke="#000" stroke-width="3"/><text x="600" y="482" font-size="21" font-weight="bold">result_B</text><text x="600" y="512" font-size="18">id = call_B</text><rect x="840" y="445" width="280" height="95" fill="#808080" stroke="#000" stroke-width="3"/><text x="980" y="482" fill="#fff" font-size="21" font-weight="bold">result_C</text><text x="980" y="512" fill="#fff" font-size="18">id = call_C</text><line x1="220" y1="340" x2="220" y2="437" stroke="#000" stroke-width="4" marker-end="url(#a)"/><line x1="600" y1="340" x2="600" y2="437" stroke="#000" stroke-width="4" marker-end="url(#a)"/><line x1="980" y1="340" x2="980" y2="437" stroke="#000" stroke-width="4" marker-end="url(#a)"/><text x="600" y="620" font-size="20" font-weight="bold">Every call needs a paired result.</text></g></svg>