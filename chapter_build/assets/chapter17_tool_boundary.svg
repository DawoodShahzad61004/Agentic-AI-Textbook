<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><rect width="1200" height="660" fill="#fff"/><g font-family="Times New Roman" text-anchor="middle"><text x="600" y="44" font-size="31" font-weight="bold">A tool call crosses a controlled boundary</text><rect x="70" y="120" width="270" height="130" rx="24" fill="#2C3E6B" stroke="#000" stroke-width="4"/><text x="205" y="165" fill="#fff" font-size="24" font-weight="bold">Model</text><text x="205" y="198" fill="#fff" font-size="18">selects action</text><text x="205" y="225" fill="#fff" font-size="18">supplies arguments</text><rect x="465" y="105" width="270" height="160" fill="#D9D9D9" stroke="#000" stroke-width="4"/><text x="600" y="145" font-size="24" font-weight="bold">Gate</text><text x="600" y="178" font-size="18">parse + validate</text><text x="600" y="205" font-size="18">inject context</text><text x="600" y="232" font-size="18">enforce limits</text><rect x="860" y="120" width="270" height="130" rx="24" fill="#808080" stroke="#000" stroke-width="4"/><text x="995" y="165" fill="#fff" font-size="24" font-weight="bold">Function</text><text x="995" y="198" fill="#fff" font-size="18">executes safely</text><text x="995" y="225" fill="#fff" font-size="18">returns result</text><line x1="340" y1="185" x2="457" y2="185" stroke="#000" stroke-width="4" marker-end="url(#a)"/><line x1="735" y1="185" x2="852" y2="185" stroke="#000" stroke-width="4" marker-end="url(#a)"/><path d="M995 250 C995 365 205 365 205 258" fill="none" stroke="#000" stroke-width="4" marker-end="url(#a)"/><text x="600" y="350" font-size="20">tool result returns as a paired message</text><rect x="190" y="430" width="820" height="145" fill="#F2F2F2" stroke="#000" stroke-width="3" stroke-dasharray="11 8"/><text x="600" y="468" font-size="21" font-weight="bold">Server-owned capabilities stay private</text><text x="600" y="505" font-size="19">retriever • credentials • collection handles</text><text x="600" y="538" font-size="19">limits • network client • authorization</text></g></svg>