<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><rect width="1200" height="660" fill="#fff"/><g font-family="Times New Roman" text-anchor="middle"><text x="600" y="45" font-size="31" font-weight="bold">Three paths to improvement</text><line x1="160" y1="570" x2="1050" y2="570" stroke="#000" stroke-width="4" marker-end="url(#a)"/><text x="160" y="615" font-size="18">easy to deploy</text><text x="1020" y="615" font-size="18">research-grade</text><rect x="90" y="150" width="300" height="340" rx="26" fill="#F2F2F2" stroke="#000" stroke-width="4"/><text x="240" y="195" font-size="24" font-weight="bold">1. Memory</text><text x="240" y="238" font-size="19">Same weights</text><text x="240" y="275" font-size="19">Store experience</text><text x="240" y="312" font-size="19">Retrieve later</text><text x="240" y="365" font-size="18" font-weight="bold">Fast + reversible</text><text x="240" y="397" font-size="18">auditable • local</text><text x="240" y="452" font-size="18">Memora uses this</text><rect x="450" y="150" width="300" height="340" rx="26" fill="#D9D9D9" stroke="#000" stroke-width="4"/><text x="600" y="195" font-size="24" font-weight="bold">2. Fine-tuning</text><text x="600" y="238" font-size="19">Update weights</text><text x="600" y="275" font-size="19">Curate dataset</text><text x="600" y="312" font-size="19">Train + evaluate</text><text x="600" y="365" font-size="18" font-weight="bold">Slower update</text><text x="600" y="397" font-size="18">versioned model</text><text x="600" y="452" font-size="18">needs clean data</text><rect x="810" y="150" width="300" height="340" rx="26" fill="#808080" stroke="#000" stroke-width="4"/><text x="960" y="195" fill="#fff" font-size="24" font-weight="bold">3. Preference</text><text x="960" y="238" fill="#fff" font-size="19">Preference data</text><text x="960" y="275" fill="#fff" font-size="19">Rank responses</text><text x="960" y="312" fill="#fff" font-size="19">Optimize policy</text><text x="960" y="365" fill="#fff" font-size="18" font-weight="bold">Complex pipeline</text><text x="960" y="397" fill="#fff" font-size="18">heavy evaluation</text><text x="960" y="452" fill="#fff" font-size="18">DPO / RLHF</text></g></svg>