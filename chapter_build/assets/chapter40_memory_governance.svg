<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><rect width="1200" height="690" fill="#fff"/><g font-family="Times New Roman" text-anchor="middle"><text x="600" y="45" font-size="31" font-weight="bold">A learned record needs a full lifecycle</text><rect x="65" y="135" width="210" height="90" rx="22" fill="#F2F2F2" stroke="#000" stroke-width="3"/><text x="170" y="172" font-size="21" font-weight="bold">Candidate</text><text x="170" y="201" font-size="17">candidate record</text><rect x="345" y="135" width="210" height="90" fill="#D9D9D9" stroke="#000" stroke-width="3"/><text x="450" y="172" font-size="21" font-weight="bold">Review</text><text x="450" y="201" font-size="17">quality + source</text><rect x="625" y="135" width="210" height="90" fill="#808080" stroke="#000" stroke-width="3"/><text x="730" y="172" fill="#fff" font-size="21" font-weight="bold">Store</text><text x="730" y="201" fill="#fff" font-size="17">scoped record</text><ellipse cx="1010" cy="180" rx="115" ry="70" fill="#2C3E6B" stroke="#000" stroke-width="4"/><text x="1010" y="171" fill="#fff" font-size="20" font-weight="bold">Memory</text><text x="1010" y="199" fill="#fff" font-size="16">learned records</text><line x1="275" y1="180" x2="337" y2="180" stroke="#000" stroke-width="4" marker-end="url(#a)"/><line x1="555" y1="180" x2="617" y2="180" stroke="#000" stroke-width="4" marker-end="url(#a)"/><line x1="835" y1="180" x2="887" y2="180" stroke="#000" stroke-width="4" marker-end="url(#a)"/><rect x="130" y="410" width="220" height="95" fill="#F2F2F2" stroke="#000" stroke-width="3"/><text x="240" y="446" font-size="21" font-weight="bold">Audit</text><text x="240" y="477" font-size="17">owner • age</text><rect x="490" y="410" width="220" height="95" fill="#D9D9D9" stroke="#000" stroke-width="3"/><text x="600" y="446" font-size="21" font-weight="bold">Correct</text><text x="600" y="477" font-size="17">replace record</text><rect x="850" y="410" width="220" height="95" rx="22" fill="#2C3E6B" stroke="#000" stroke-width="4"/><text x="960" y="446" fill="#fff" font-size="21" font-weight="bold">Forget</text><text x="960" y="477" fill="#fff" font-size="17">delete + verify</text><path d="M1010 250 C1010 320 240 320 240 402" fill="none" stroke="#000" stroke-width="4" marker-end="url(#a)"/><line x1="350" y1="457" x2="482" y2="457" stroke="#000" stroke-width="4" marker-end="url(#a)"/><line x1="710" y1="457" x2="842" y2="457" stroke="#000" stroke-width="4" marker-end="url(#a)"/><path d="M600 410 C600 350 730 350 730 233" fill="none" stroke="#000" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="665" y="348" font-size="17">approved correction returns</text><text x="600" y="610" font-size="19" font-weight="bold">Learned records must be explainable and erasable.</text></g></svg>